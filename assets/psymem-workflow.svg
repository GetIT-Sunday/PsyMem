<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">PsyMem workflow</title>
  <desc id="desc">A visual overview of PsyMem managing memories, MCP servers, skills, and sessions through natural language.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#1b2c47"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".14"/><stop offset="1" stop-color="#ffffff" stop-opacity=".06"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".24"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#7dd3fc"/></marker>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="1400" cy="100" r="240" fill="#38bdf8" opacity=".10"/><circle cx="180" cy="760" r="260" fill="#a78bfa" opacity=".10"/>
  <text x="110" y="118" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="64" font-weight="800">PsyMem</text>
  <text x="112" y="166" fill="#a8c2da" font-family="Inter,Arial,sans-serif" font-size="26">Your agent workspace, organized and searchable</text>
  <rect x="111" y="218" width="1378" height="170" rx="26" fill="url(#card)" stroke="#ffffff" stroke-opacity=".16" filter="url(#shadow)"/>
  <text x="155" y="267" fill="#7dd3fc" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">NATURAL LANGUAGE</text>
  <text x="155" y="327" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="600">“Search my memories and show the security skills I can install.”</text>
  <path d="M800 420V470" stroke="#7dd3fc" stroke-width="5" marker-end="url(#arrow)"/>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="111" y="505" width="310" height="220" rx="24" fill="#f8fafc" filter="url(#shadow)"/><circle cx="170" cy="568" r="27" fill="#dbeafe"/><text x="158" y="578" fill="#2563eb" font-size="28" font-weight="800">M</text><text x="155" y="642" fill="#0f172a" font-size="28" font-weight="800">Memories</text><text x="155" y="682" fill="#475569" font-size="18">Projects · search · init</text>
    <rect x="467" y="505" width="310" height="220" rx="24" fill="#f8fafc" filter="url(#shadow)"/><circle cx="526" cy="568" r="27" fill="#dcfce7"/><text x="514" y="578" fill="#16a34a" font-size="28" font-weight="800">S</text><text x="511" y="642" fill="#0f172a" font-size="28" font-weight="800">MCP Servers</text><text x="511" y="682" fill="#475569" font-size="18">Inspect · add · update</text>
    <rect x="823" y="505" width="310" height="220" rx="24" fill="#f8fafc" filter="url(#shadow)"/><circle cx="882" cy="568" r="27" fill="#fef3c7"/><text x="870" y="578" fill="#d97706" font-size="28" font-weight="800">K</text><text x="867" y="642" fill="#0f172a" font-size="28" font-weight="800">Skills</text><text x="867" y="682" fill="#475569" font-size="18">Browse · read · install</text>
    <rect x="1179" y="505" width="310" height="220" rx="24" fill="#f8fafc" filter="url(#shadow)"/><circle cx="1238" cy="568" r="27" fill="#ede9fe"/><text x="1227" y="578" fill="#7c3aed" font-size="28" font-weight="800">A</text><text x="1223" y="642" fill="#0f172a" font-size="28" font-weight="800">Sessions</text><text x="1223" y="682" fill="#475569" font-size="18">List · inspect · resume</text>
  </g>
  <text x="112" y="820" fill="#d8e8f6" font-family="Inter,Arial,sans-serif" font-size="22">One MCP server · 15 focused tools · Claude Code ready</text>
  <text x="1488" y="820" text-anchor="end" fill="#7dd3fc" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">github.com/GetIT-Sunday/PsyMem</text>
</svg>
