  <text x="375" y="292" font-family="monospace" font-size="12" font-weight="700" fill="#1c59c4"># Skill Studio</text>
  <text x="375" y="336" font-family="monospace" font-size="12" fill="#27343e">Use this Skill to inspect installed Codex Skills</text>
